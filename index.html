<style>

form{background:linear-gradient(170deg,var(--plum2),var(--plum));border:1px solid #3d2a5e;border-radius:14px 2px 14px 2px;padding:20px;display:grid;gap:13px}
@media(min-width:1000px){

form .help{display:none;margin-top:-4px;font-size:12.5px;line-height:1.35}
form .help.show{display:block}
form h2{font-size:17px}
form input,form select{padding:6px 9px}

form .go{position:sticky;bottom:0;margin:4px -18px 0;padding:13px;border-radius:0;box-shadow:0 -12px 14px -4px var(--plum)}

/* --- notices, guide, chart patterns --- */
.banner{border:1px dashed var(--lav);border-radius:2px;padding:10px 14px;color:var(--lav);font-size:14.5px}

details.guide{background:var(--plum);border-left:3px solid var(--lav);padding:10px 14px;min-width:0}

</style>

<script>
(function(){
var cv=document.getElementById('sky');if(!cv||!cv.getContext)return;
var ctx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,dpr=1,stars=[],rings=[],blobs=[],shoot=null,nextShoot=0,last=0,T=0;
var TAU=Math.PI*2,COL=['169,149,224','200,70,127','217,169,91','111,181,150'];
function rnd(a,b){return a+Math.random()*(b-a)}
function sprite(c,n){var o=document.createElement('canvas');o.width=o.height=n;var g=o.getContext('2d'),
  r=g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);r.addColorStop(0,'rgba('+c+',1)');r.addColorStop(1,'rgba('+c+',0)');
  g.fillStyle=r;g.fillRect(0,0,n,n);return o}
var SPR={},BLOB={};COL.forEach(function(c){SPR[c]=sprite(c,48);BLOB[c]=sprite(c,128)});

function build(){
  var area=W*H,n=Math.min(150,Math.round(area/12000));
  stars=[];
  for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:rnd(.4,1.5),
    tw:rnd(.4,1.6),ph:rnd(0,TAU),v:rnd(1.5,7),c:Math.random()<.18?COL[(Math.random()*4)|0]:'230,220,239'});
  var m=Math.min(W,H),big=Math.hypot(W,H)*.5;
  rings=[];
  for(var k=0;k<8;k++){
    var rx=m*.14+(big-m*.14)*(k/7)*(k/7)*.95+m*.06*k;
    rings.push({rx:rx,ry:rx*rnd(.28,.6),tilt:rnd(0,Math.PI),spin:rnd(-.012,.012),
      dash:k%3===1,a:.07+.05*Math.random(),
      dots:(k%2===0?[1]:[]).map(function(){
        return{p:rnd(0,TAU),s:rnd(.05,.16)*(Math.random()<.5?-1:1),r:rnd(1.8,3.6),c:COL[(Math.random()*4)|0]}})});
  }
  blobs=[0,1].map(function(i){return{cx:rnd(.2,.8),cy:rnd(.2,.8),r:m*rnd(.45,.8),ph:rnd(0,TAU),sp:rnd(.02,.05),c:COL[i%3]}});
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,1.5);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  build();if(reduce)draw(0,0);
}

function draw(t,dt){
  ctx.clearRect(0,0,W,H);
  var cx=W*.5,cy=H*.46,i,j;

  // slow nebula glow (pre-rendered sprites, very faint)
  ctx.globalAlpha=.05;
  for(i=0;i<blobs.length;i++){
    var b=blobs[i],bx=(b.cx+Math.sin(t*b.sp+b.ph)*.08)*W,by=(b.cy+Math.cos(t*b.sp*.8+b.ph)*.08)*H;
    ctx.drawImage(BLOB[b.c],bx-b.r,by-b.r,b.r*2,b.r*2);
  }
  ctx.globalAlpha=1;

  // stars
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    s.y-=s.v*dt;s.x-=s.v*dt*.35;
    if(s.y<-3){s.y=H+3;s.x=Math.random()*W}
    if(s.x<-3)s.x=W+3;
    var a=.25+.75*(.5+.5*Math.sin(t*s.tw+s.ph));
    ctx.fillStyle='rgba('+s.c+','+(a*.8).toFixed(3)+')';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();
  }

  // orbit rings
  ctx.save();ctx.translate(cx,cy);
  for(i=0;i<rings.length;i++){
    var r=rings[i],rot=r.tilt+t*r.spin;
    ctx.save();ctx.rotate(rot);
    ctx.lineWidth=1;ctx.strokeStyle='rgba(169,149,224,'+r.a+')';
    ctx.setLineDash(r.dash?[2,9]:[]);
    ctx.beginPath();ctx.ellipse(0,0,r.rx,r.ry,0,0,TAU);ctx.stroke();
    ctx.setLineDash([]);
    for(j=0;j<r.dots.length;j++){
      var d=r.dots[j],an=d.p+t*d.s,x=Math.cos(an)*r.rx,y=Math.sin(an)*r.ry;
      var gs=d.r*7;
      ctx.globalAlpha=.22;ctx.drawImage(SPR[d.c],x-gs/2,y-gs/2,gs,gs);ctx.globalAlpha=1;
      ctx.fillStyle='rgba('+d.c+',.6)';ctx.beginPath();ctx.arc(x,y,d.r*.6,0,TAU);ctx.fill();
    }
    ctx.restore();
  }

  // zodiac-like ring: 12 ticks + 12 small dots, drifting slowly
  var zr=Math.min(W,H)*.34,zrot=t*.008;
  ctx.strokeStyle='rgba(217,169,91,.13)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,zr,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,zr*.94,0,TAU);ctx.stroke();
  for(i=0;i<12;i++){
    var za=zrot+i*TAU/12,ca=Math.cos(za),sa=Math.sin(za);
    ctx.beginPath();ctx.moveTo(ca*zr*.94,sa*zr*.94);ctx.lineTo(ca*zr,sa*zr);ctx.stroke();
    var mid=za+TAU/24;
    ctx.fillStyle='rgba(217,169,91,.28)';
    ctx.beginPath();ctx.arc(Math.cos(mid)*zr*.97,Math.sin(mid)*zr*.97,1.8,0,TAU);ctx.fill();
  }
  ctx.restore();

  // rare shooting star
  if(!reduce){
    if(!shoot&&t>nextShoot){
      var sx=rnd(W*.3,W),sy=rnd(0,H*.5);
      shoot={x:sx,y:sy,vx:-rnd(380,560),vy:rnd(160,260),life:0};
    }
    if(shoot){
      shoot.life+=dt;shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;
      var f=Math.max(0,1-shoot.life/1.1),L=90;
      var n=Math.hypot(shoot.vx,shoot.vy),tx=shoot.x-shoot.vx/n*L,ty=shoot.y-shoot.vy/n*L;
      var lg=ctx.createLinearGradient(shoot.x,shoot.y,tx,ty);
      lg.addColorStop(0,'rgba(230,220,239,'+(.8*f).toFixed(3)+')');lg.addColorStop(1,'rgba(230,220,239,0)');
      ctx.strokeStyle=lg;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(tx,ty);ctx.stroke();
      if(f<=0){shoot=null;nextShoot=t+rnd(9,20)}
    }
  }
}

function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
  draw(T,dt);requestAnimationFrame(frame);
}

nextShoot=6;
addEventListener('resize',resize);
resize();
if(!reduce)requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(frame)});
})();
</script>
