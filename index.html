<style>
:root{color-scheme:dark;--void:#09060f;--plum:#1a1029;--plum2:#261840;--bone:#e6dcef;--dim:#9a8bb0;--rose:#c8467f;--moss:#6fb596;--amber:#d9a95b;--lav:#a995e0}
*{box-sizing:border-box;margin:0}
html{background:var(--void)}
body{min-height:100dvh;color:var(--bone);font:16px/1.6 "Palatino Linotype",Palatino,Georgia,serif;padding:22px 14px 60px;
background:radial-gradient(ellipse 80% 50% at 50% 0,#2a1646 0,transparent 70%),radial-gradient(ellipse at 20% 100%,#1d0d2c 0,transparent 60%),var(--void)}
header{max-width:1180px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-weight:400;font-size:clamp(28px,5vw,46px);letter-spacing:.14em;line-height:1.1}
h1 small{display:block;font-size:.34em;letter-spacing:.02em;line-height:1.5;color:var(--dim);margin-top:9px;font-style:normal;font-weight:400;max-width:720px}
button,input,select{font:inherit;color:inherit}
.lang{background:none;border:1px solid var(--dim);border-radius:2px;padding:4px 14px;cursor:pointer;color:var(--dim)}
.lang:hover,.lang:focus-visible{color:var(--bone);border-color:var(--bone)}

main{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media(min-width:1000px){main{display:grid;grid-template-columns:340px minmax(0,1fr);align-items:start}}

form{background:linear-gradient(170deg,var(--plum2),var(--plum));border:1px solid #3d2a5e;border-radius:14px 2px 14px 2px;padding:20px;display:grid;gap:13px}
@media(min-width:1000px){
form{position:sticky;top:12px;max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;gap:9px;padding:16px 18px 0;scrollbar-width:thin;scrollbar-color:#3d2a5e transparent}
form .help{display:none;margin-top:-4px;font-size:12.5px;line-height:1.35}
form .help.show{display:block}
form h2{font-size:17px}
form input,form select{padding:6px 9px}
form label{gap:2px;font-size:13px}
form .go{position:sticky;bottom:0;margin:4px -18px 0;padding:13px;border-radius:0;box-shadow:0 -12px 14px -4px var(--plum)}
}

form h2,.res h2{font-weight:400;font-size:19px;letter-spacing:.08em;color:var(--lav)}
label{display:grid;gap:3px;font-size:14px;color:var(--dim)}
input,select{background:#0e0817;border:1px solid #3d2a5e;border-radius:2px;padding:8px 10px;width:100%;color-scheme:dark}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}.chk input{width:auto}
.hint{font-size:13px;color:var(--dim);font-style:italic}
.pw{position:relative}
#sug{position:absolute;z-index:5;left:0;right:0;top:100%;background:#120a1e;border:1px solid var(--rose);list-style:none;padding:0;max-height:220px;overflow:auto}
#sug li{padding:7px 10px;cursor:pointer}#sug li:hover,#sug li.on{background:var(--plum2)}
.go{background:var(--rose);border:0;border-radius:2px;padding:11px;font-size:17px;letter-spacing:.1em;cursor:pointer;color:#14040c;font-weight:700}
.go:hover{background:#dd5a95}
.err{color:#ff8fb3;min-height:1.4em;font-size:14px}
.res{display:grid;gap:20px;min-width:0;scroll-margin-top:18px}
.empty{border:1px dashed #3d2a5e;border-radius:12px;padding:60px 20px;text-align:center;color:var(--dim);font-style:italic}
.chart{background:radial-gradient(circle,#150c25 0,#0b0714 70%);border:1px solid #3d2a5e;border-radius:50%/50%;padding:2%;max-width:820px;width:100%;margin:0 auto;aspect-ratio:1}
.chart svg{width:100%;height:100%;display:block}
.sym{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","Apple Symbols","DejaVu Sans",serif}
.quick{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.q{background:var(--plum);border-left:3px solid var(--rose);padding:10px 14px}
.q b{font-weight:400;font-size:18px}.q .g{color:var(--amber);margin-right:6px}
.q p{font-size:14px;color:var(--dim);line-height:1.45;margin-top:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #2c1e45;font-size:15px}
th{font-weight:400;color:var(--dim);font-style:italic}
.act{display:flex;gap:10px;flex-wrap:wrap}.act button{background:none;border:1px solid var(--lav);color:var(--lav);padding:7px 16px;border-radius:2px;cursor:pointer}
.act button:hover{background:var(--plum2)}
.note{font-size:13px;color:var(--dim);max-width:70ch}

.help{font-size:13px;color:var(--dim);line-height:1.45;margin-top:-7px}
.chart svg text,.chart svg line,.chart svg circle,.chart svg path{pointer-events:none}
.chart svg [data-tip]{pointer-events:all;cursor:pointer}
.chart svg [data-tip]:focus{outline:none}
.chart svg [data-tip]:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.chart svg line.hit:hover{stroke:#e0b86638}
.chart svg path.hit:hover{fill:#e0b86618}
.chart svg path[data-tip]:not(.hit):hover{filter:brightness(1.7)}
.chart svg circle[data-tip]:hover{fill:#2d1a4d}
.chart-hint{text-align:center;margin-top:-8px}
.sec{display:grid;gap:8px;min-width:0}
.sec .note{margin:0}
table.at{width:auto;min-width:0;margin:0 auto 0 0}
.at th,.at td{padding:0;width:36px;min-width:36px;height:34px;text-align:center;border:1px solid #2c1e45;font-size:19px;line-height:1;font-style:normal;color:var(--bone)}
.at th{color:var(--amber);background:var(--plum);font-size:16px}
.at td.e{background:#0d0816}
.at td[data-tip]{cursor:pointer}
.at td[data-tip]:hover,.at td[data-tip]:focus-visible{background:#2d1a4d;outline:none}
.at td[data-tip]:focus-visible{box-shadow:inset 0 0 0 2px var(--rose)}
table.dist{width:auto;min-width:0}
.dist th,.dist td{text-align:center;padding:7px 14px;font-style:normal}
.dist th:first-child,.dist td:first-child{text-align:left}
.dist td.g{font-size:18px;min-width:84px}
.dist .tot{color:var(--amber)}
.stars tr.hit td{color:var(--amber)}
#tip{position:fixed;z-index:50;left:0;top:0;width:max-content;max-width:330px;background:#120a1e;border:1px solid var(--rose);border-radius:12px 2px 12px 2px;padding:12px 16px 12px;box-shadow:0 10px 34px #000b;font-size:14px;line-height:1.5;display:none;pointer-events:none}
#tip.on{display:block}
#tip.pin{pointer-events:auto;padding-right:34px}
#tip h3{font-weight:400;font-size:18px;color:var(--lav);line-height:1.3}
#tip .sub{color:var(--amber);font-size:13px;margin:1px 0 6px}
#tip p{margin-top:5px}
#tip p.dim{color:var(--dim);font-size:12.5px}
#tip .x{position:absolute;top:2px;right:4px;background:none;border:0;color:var(--dim);font-size:24px;line-height:1;padding:6px 9px;cursor:pointer;display:none}
#tip.pin .x{display:block}
#tip .x:hover{color:var(--bone)}
@media(max-width:700px){#tip{left:10px!important;right:10px;bottom:10px;top:auto!important;width:auto;max-width:none;max-height:55dvh;overflow:auto}}

/* --- zoom, reset button, mobile fit --- */
body{overflow-x:clip}
.chart{overflow:hidden;touch-action:pan-y}
.chart.zoomed{touch-action:none}
.chart.zoomed svg{cursor:grab}
.chart svg{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.zbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:-10px}
.zbar button{background:none;border:1px solid var(--lav);color:var(--lav);min-width:44px;height:40px;border-radius:2px;cursor:pointer;font-size:20px;line-height:1;padding:0 12px}
.zbar button:hover:not(:disabled){background:var(--plum2)}
.zbar button:disabled{opacity:.35;cursor:default}
.fh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fh .lang{padding:2px 12px;font-size:13px}
@media(max-width:700px){
body{padding:16px 10px 48px}
form{padding:16px 14px}
label,.row>*,input,select{min-width:0}
.quick{grid-template-columns:1fr}
table,table.dist{min-width:0;width:100%}
th,td{padding:6px 5px;font-size:13.5px;overflow-wrap:anywhere}
.dist th,.dist td{padding:6px 4px;font-size:13px}
.dist td.g{min-width:0;font-size:15px}
table.at{width:100%;table-layout:fixed;margin:0}
.at th,.at td{width:auto;min-width:0;height:26px;padding:0;font-size:13px}
.at th{font-size:11px}
}
</style>
</head>
<body>
<header>
<h1 id="title">Birth Chart<small data-t="sub"></small></h1>
<button class="lang" id="lb" type="button">Suomeksi</button>
</header>
<main>
<form id="f" autocomplete="off" novalidate>
<div class="fh"><h2 data-t="your"></h2><button type="button" class="lang" id="rs" data-t="reset"></button></div>
<p class="help" data-t="intro"></p>
<div class="row dt"><label><span data-t="date"></span><input type="date" id="d" required min="1800-01-01" max="2099-12-31" value="2000-01-01"></label>
<label><span data-t="time"></span><input type="time" id="tm" value="12:00"></label></div>
<p class="help" data-t="hDate"></p>
<label class="chk"><input type="checkbox" id="unk"><span data-t="unk"></span></label>
<p class="help" data-t="hTime"></p>
<label><span data-t="country"></span><select id="c"></select></label>
<div class="pw"><label><span data-t="place"></span><input type="text" id="p" role="combobox" aria-autocomplete="list" aria-controls="sug" value="Helsinki"></label><ul id="sug" hidden></ul></div>
<p class="help" data-t="hint"></p>
<label class="chk"><input type="checkbox" id="man"><span data-t="man"></span></label>
<p class="help" data-t="hMan"></p>
<label><span data-t="hsys"></span><select id="hs"><option value="P">Placidus</option><option value="K">Koch</option><option value="W" data-t="hsW"></option><option value="E" data-t="hsE"></option></select></label>
<p class="help" data-t="hHs"></p>
<label><span data-t="aspm"></span><select id="asp"><option value="all" data-t="aspAll"></option><option value="major" data-t="aspMaj"></option></select></label>
<label class="chk"><input type="checkbox" id="ext" checked><span data-t="ext"></span></label>
<p class="help" data-t="hExt"></p>
<div id="mb" hidden style="display:none;gap:10px">
<div class="row"><label>lat<input id="la" inputmode="decimal" value="60.17"></label><label>lon<input id="lo" inputmode="decimal" value="24.94"></label></div>
<label><span data-t="tz"></span><input id="tz" value="Europe/Helsinki"></label>
</div>
<div class="err" id="er" role="alert"></div>
<button class="go" type="submit" data-t="go">Laske kartta 🚀</button>
</form>
<section class="res" id="res" aria-live="polite"><div class="empty" data-t="empty"></div></section>
</main>
<div id="tip" role="tooltip"></div>
<footer id="credit" class="note" style="max-width:1180px;margin:28px auto 0;text-align:center">Millaceedee <a href="https://github.com/Millaceedee/" target="_blank" rel="noopener noreferrer" style="color:inherit">© 2026</a>. Licensed under the MIT License.</footer>
<script src="js/astronomy.js"></script>
<script src="js/app.js"></script>
</body>
</html>
